name: celsuis
description: An offline music player for your local music library.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  just_audio: ^0.9.40
  audio_service: ^0.18.15
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.3
  permission_handler: ^11.3.1
  path_provider: ^2.1.5
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  cached_network_image: ^3.4.1
  meta: ^1.15.0
  collection: ^1.19.1
  uuid: ^4.5.1
  flutter_audio_tagger: ^5.0.1
  file_picker: ^8.0.0
  package_info_plus: ^8.0.0
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
